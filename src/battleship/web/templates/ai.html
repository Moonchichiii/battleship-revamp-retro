{% extends "base.html" %}

{% block title %}Tactical Simulation (AI) — Battleship{% endblock %}

{% block content %}
<section class="panel is-active">
    <div class="site-header">
        <h2>Tactical Simulation</h2>
        <div class="subtitle">Select Adversary Intelligence Level</div>
    </div>

    <div class="game-controls ai-controls">
        <div class="actions ai-actions">
            <!-- Cadet -->
            <button
                class="btn"
                hx-post="/ai/start"
                hx-vals='{"tier": "rookie"}'
                hx-target="#main"
                hx-swap="innerHTML"
                hx-push-url="true"
            >
                <span class="ai-tier-icon">❖</span>
                ROOKIE
                <div class="hint">Randomized</div>
            </button>

            <!-- Commander -->
            <button
                class="btn"
                hx-post="/ai/start"
                hx-vals='{"tier": "veteran"}'
                hx-target="#main"
                hx-swap="innerHTML"
                hx-push-url="true"
            >
                <span class="ai-tier-icon">❖❖</span>
                VETERAN
                <div class="hint">Hunting Logic</div>
            </button>

            <!-- Admiral -->
            <button
                class="btn"
                hx-post="/ai/start"
                hx-vals='{"tier": "admiral"}'
                hx-target="#main"
                hx-swap="innerHTML"
                hx-push-url="true"
            >
                <span class="ai-tier-icon">❖❖❖</span>
                ADMIRAL
                <div class="hint">Probability Math</div>
            </button>

            <!-- PSY-OPS (LLM) -->
            <button
                class="btn btn-alert"
                hx-post="/ai/start"
                hx-vals='{"tier": "psy-ops"}'
                hx-target="#main"
                hx-swap="innerHTML"
                hx-push-url="true"
                hx-indicator="#ai-loader"
            >
                <span class="ai-tier-icon">☠</span>
                PSY-OPS
                <div class="hint hint-alert">GPT-4 Powered</div>
            </button>
        </div>

        <!-- Loader for LLM Latency -->
        <div id="ai-loader" class="htmx-indicator ai-loader">
            <div class="blink ai-loader-text">
                >> ESTABLISHING UPLINK WITH AI CORE...
            </div>
        </div>
    </div>
</section>
{% endblock %}
